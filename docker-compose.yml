version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tracetrail
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/tracetrail
      SECRET_KEY: supersecretkey
      CORS_ORIGINS: http://localhost:3000
      ENABLE_RATE_LIMITS: "false"
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  ai_module:
    build:
      context: ./ai_module
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AI_API_HOST: 0.0.0.0
      AI_API_PORT: 8082
    depends_on:
      - backend
    ports:
      - "8082:8082"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
