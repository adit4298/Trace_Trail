[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracetrail-backend"
version = "0.1.0"
description = "TraceTrail FastAPI backend service"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["fastapi", "sqlalchemy", "tracetrail"]
dependencies = []

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "flake8",
    "mypy",
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-dir]
"src" = "src"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
show_column_numbers = true
show_error_codes = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

