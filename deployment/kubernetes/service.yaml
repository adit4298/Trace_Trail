apiVersion: v1
kind: Namespace
metadata:
  name: tracetrail
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracetrail-config
  namespace: tracetrail
data:
  APP_NAME: "TraceTrail API"
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "production"
  CORS_ORIGINS: "https://app.tracetrail.com"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "30"
  EXTENSION_ENABLED: "true"
  EXTENSION_WEBSOCKET_ENABLED: "true"
  VITE_API_BASE_URL: "https://api.tracetrail.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: tracetrail-secrets
  namespace: tracetrail
type: Opaque
stringData:
  SECRET_KEY: "replace-with-real-secret"
  DATABASE_URL: "postgresql+psycopg://tracetrail:<postgres-password>@postgres.tracetrail.svc.cluster.local:5432/tracetrail"
  POSTGRES_PASSWORD: "postgres-password"
