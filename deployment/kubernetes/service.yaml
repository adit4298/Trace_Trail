apiVersion: v1
kind: Namespace
metadata:
  name: tracetrail
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracetrail-config
  namespace: tracetrail
data:
  APP_NAME: "TraceTrail API"
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "production"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "30"
  CORS_ORIGINS: "https://app.tracetrail.com"
  EXTENSION_ENABLED: "true"
  EXTENSION_WEBSOCKET_ENABLED: "true"
  VITE_API_BASE_URL: "https://api.tracetrail.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: tracetrail-secrets
  namespace: tracetrail
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_ME"
  DATABASE_URL: "postgresql+psycopg://tracetrail:REPLACE_ME@postgres:5432/tracetrail"
  REDIS_URL: "redis://redis:6379/0"
  DB_NAME: "tracetrail"
  DB_USER: "tracetrail"
  DB_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: tracetrail
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tracetrail
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: ai-module
  namespace: tracetrail
spec:
  selector:
    app: ai-module
  ports:
    - port: 8100
      targetPort: 8100
  type: ClusterIP

