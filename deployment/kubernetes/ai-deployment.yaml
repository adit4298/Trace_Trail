apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-module
  namespace: tracetrail
  labels:
    app: ai-module
    app.kubernetes.io/component: ai
    app.kubernetes.io/part-of: tracetrail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-module
  template:
    metadata:
      labels:
        app: ai-module
    spec:
      containers:
        - name: ai-module
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/tracetrail-ai:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_URL
              value: http://backend.tracetrail.svc.cluster.local:8000
          ports:
            - name: http
              containerPort: 8100
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-module
  namespace: tracetrail
  labels:
    app: ai-module
spec:
  selector:
    app: ai-module
  ports:
    - name: http
      port: 8100
      targetPort: 8100
  type: ClusterIP

