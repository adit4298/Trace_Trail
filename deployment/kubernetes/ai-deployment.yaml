apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-module
  namespace: tracetrail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-module
  template:
    metadata:
      labels:
        app: ai-module
    spec:
      containers:
        - name: ai-module
          image: ghcr.io/your-org/tracetrail-ai:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_URL
              value: http://backend.tracetrail.svc.cluster.local:8000
          ports:
            - containerPort: 8100
          readinessProbe:
            httpGet:
              path: /
              port: 8100
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8100
            initialDelaySeconds: 30
            periodSeconds: 30

