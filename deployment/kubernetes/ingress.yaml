apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tracetrail-ingress
  namespace: tracetrail
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-2:661235013110:certificate/d1159438-3860-403c-bb19-1d504a33c970
    alb.ingress.kubernetes.io/group.name: tracetrail

spec:
  ingressClassName: alb
  rules:
    - host: app.tracetrail.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

    - host: api.tracetrail.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80      # 👈 changed from 8000 to 80
