apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tracetrail
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: tracetrail/backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-service:5432/$(DB_NAME)
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis-service:6379/0
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tracetrail-secrets
                  key: SECRET_KEY
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: tracetrail-config
                  key: ENVIRONMENT
          envFrom:
            - configMapRef:
                name: tracetrail-config
            - secretRef:
                name: tracetrail-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: tracetrail
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
