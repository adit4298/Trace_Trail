# --- Backend ConfigMap: non-secret settings
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracetrail-backend-config
  namespace: tracetrail
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  # URL the backend uses to talk to the AI module inside the cluster
  AI_MODULE_URL: "http://ai-module.tracetrail.svc.cluster.local:8100"

---
# --- Backend Secrets: DB / Redis / app secrets (PLACEHOLDERS, EDIT THESE!)
apiVersion: v1
kind: Secret
metadata:
  name: tracetrail-backend-secrets
  namespace: tracetrail
type: Opaque
stringData:
  DATABASE_URL: ""             # e.g. postgresql://user:pass@host:5432/dbname
  SECRET_KEY: "change-me-secret-key"
  DB_USER: ""
  DB_PASSWORD: ""
  DB_HOST: ""
  DB_PORT: ""
  DB_NAME: ""
  REDIS_URL: ""                # e.g. redis://host:6379/0

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tracetrail
  labels:
    app: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tracetrail
spec:
  # start with 1 replica so it schedules easily; you can scale later
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: backend
          image: 661235013110.dkr.ecr.ap-southeast-2.amazonaws.com/tracetrail-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: tracetrail-backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tracetrail-backend-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tracetrail-backend-secrets
                  key: SECRET_KEY
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: tracetrail-backend-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tracetrail-backend-secrets
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: tracetrail-backend-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: tracetrail-backend-secrets
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: tracetrail-backend-secrets
                  key: DB_NAME
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: tracetrail-backend-secrets
                  key: REDIS_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 750m
              memory: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: tracetrail
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
