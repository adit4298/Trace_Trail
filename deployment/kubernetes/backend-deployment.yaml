# --- Backend ConfigMap: non-secret settings
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracetrail-backend-config
  namespace: tracettrail
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  # URL the backend uses to talk to the AI module inside the cluster
  AI_MODULE_URL: "http://ai-module.tracetrail.svc.cluster.local:8100"

---
# --- Backend Secrets: DB / app secrets (RDS PostgreSQL)
apiVersion: v1
kind: Secret
metadata:
  name: tracetrail-backend-secrets
  namespace: tracettrail
type: Opaque
stringData:
  # Full Postgres DSN pointing at your RDS instance
  # NOTE: password May#!Mon05 is URL-encoded as May%23%21Mon05
  DATABASE_URL: "postgresql://tracetrail:May%23%21Mon05@tracetrail-db.c9os064iejax.ap-southeast-2.rds.amazonaws.com:5432/trace_trail"

  SECRET_KEY: "8jIBTuwJX3NNqJDbNfBQavIAv-XnjLs4rNaRPeemEh0"

  # These match the parts of DATABASE_URL above
  DB_USER: "tracetrail"
  DB_PASSWORD: "May#!Mon05"
  DB_HOST: "tracetrail-db.c9os064iejax.ap-southeast-2.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "trace_trail"

  # Leave empty unless you actually set up Redis
  REDIS_URL: ""

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tracettrail
  labels:
    app: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tracetrail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: backend
          image: 027551668461.dkr.ecr.ap-southeast-2.amazonaws.com/tracettrail-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: tracetrail-backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tracetrail-backend-secrets
                  key: DATABASE_URL
            - name: TRACE_TRAIL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tracetrail-backend-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tracetrail-backend-secrets
                  key: SECRET_KEY
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: tracetrail-backend-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tracetrail-backend-secrets
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: tracetrail-backend-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: tracetrail-backend-secrets
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: tracetrail-backend-secrets
                  key: DB_NAME
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: tracetrail-backend-secrets
                  key: REDIS_URL

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 750m
              memory: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: tracettrail
  labels:
    app: backend
spec:
  selector:
    app: backend
  type: LoadBalancer
  ports:
    - name: http
      port: 80          # external port
      targetPort: 8000  # backend container port
