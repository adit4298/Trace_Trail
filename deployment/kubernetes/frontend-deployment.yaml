apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tracetrail
  labels:
    app: frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: tracetrail
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: frontend
          image: 661235013110.dkr.ecr.ap-southeast-2.amazonaws.com/tracetrail-frontend:latest
          imagePullPolicy: Always

          # NGINX serves on port 80 (NOT 3000)
          ports:
            - name: http
              containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi

---

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tracetrail
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80        # internal service port
      targetPort: 80  # NGINX container port
  type: ClusterIP     # IMPORTANT: we use Ingress + ALB, not LoadBalancer
