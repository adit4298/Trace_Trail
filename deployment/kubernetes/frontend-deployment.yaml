apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tracetrail
  labels:
    app: frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: tracetrail
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: frontend
          image: 661235013110.dkr.ecr.ap-southeast-2.amazonaws.com/tracetrail-frontend:v3
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi

---

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tracetrail
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80        # internal service port
      targetPort: 3000  # Node container port
  type: ClusterIP     # IMPORTANT: we use Ingress + ALB, not LoadBalancer
