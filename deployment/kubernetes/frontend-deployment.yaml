apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tracettrail
  labels:
    app: frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: tracettrail
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: frontend
          image: 027551668461.dkr.ecr.ap-southeast-2.amazonaws.com/tracettrail-frontend:latest
          imagePullPolicy: Always

          env:
            - name: NEXT_PUBLIC_BACKEND_URL
              value: http://backend

          ports:
            - name: http
              containerPort: 3000

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tracettrail
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
  type: ClusterIP
