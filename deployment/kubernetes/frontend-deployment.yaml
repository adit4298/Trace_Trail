apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tracetrail
  labels:
    app: frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: tracetrail
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: frontend
          image: 661235013110.dkr.ecr.ap-southeast-2.amazonaws.com/tracetrail-frontend:latest
          imagePullPolicy: Always
          # If you REALLY want envs from a ConfigMap, we can add it later.
          # For now, NEXT_PUBLIC_API_URL is baked into the build via .env.production.
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tracetrail
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80         # external port (LB)
      targetPort: 3000 # Next.js container port
  type: LoadBalancer
