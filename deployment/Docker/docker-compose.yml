version: "3.9"

# Run from the repository root:
# docker compose --env-file deployment/environments/development.env \
#   -f deployment/Docker/docker-compose.yml up --build

services:
  postgres:
    image: postgres:15-alpine
    container_name: tracetrail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracetrail}
      POSTGRES_USER: ${POSTGRES_USER:-tracetrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracetrail}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tracetrail
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracetrail}"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build:
      context: ../..
      dockerfile: deployment/Docker/Dockerfile.backend
    container_name: tracetrail-backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-TraceTrail API}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tracetrail}:${POSTGRES_PASSWORD:-tracetrail}@postgres:5432/${POSTGRES_DB:-tracetrail}
      SECRET_KEY: ${SECRET_KEY:-local-dev-secret}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      EXTENSION_ENABLED: ${EXTENSION_ENABLED:-false}
      EXTENSION_WEBSOCKET_ENABLED: ${EXTENSION_WEBSOCKET_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tracetrail
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/hello"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  ai-module:
    build:
      context: ../..
      dockerfile: deployment/Docker/Dockerfile.ai
    container_name: tracetrail-ai
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      MODEL_CONFIG_PATH: config/model_config.json
      DATASET_PATH: data/datasets
      AI_API_PORT: 8100
    ports:
      - "${AI_PORT:-8100}:8100"
    depends_on:
      backend:
        condition: service_started
    networks:
      - tracetrail
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/docs"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../..
      dockerfile: deployment/Docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: tracetrail-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - tracetrail
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: tracetrail-proxy
    restart: unless-stopped
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - tracetrail

networks:
  tracetrail:
    driver: bridge

volumes:
  postgres_data:
