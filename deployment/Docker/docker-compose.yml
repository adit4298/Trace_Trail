version: '3.8'
version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracetrail}
      POSTGRES_USER: ${POSTGRES_USER:-tracetrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracetrail}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    build:
      context: ../..
      dockerfile: deployment/Docker/Dockerfile.backend
    env_file:
      - ../environments/development.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tracetrail}:${POSTGRES_PASSWORD:-tracetrail}@postgres:5432/${POSTGRES_DB:-tracetrail}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  ai:
    build:
      context: ../..
      dockerfile: deployment/Docker/Dockerfile.ai
    env_file:
      - ../environments/development.env
    environment:
      BACKEND_API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "${AI_PORT:-8100}:8100"

  frontend:
    build:
      context: ../..
      dockerfile: deployment/Docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    env_file:
      - ../environments/development.env
    environment:
      VITE_API_BASE_URL: http://localhost:${NGINX_HTTP_PORT:-8080}/api
    depends_on:
      - backend

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    environment:
      BACKEND_HOST: backend
      FRONTEND_HOST: frontend

volumes:
  postgres-data:
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tracetrail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tracetrail}
      POSTGRES_USER: ${DB_USER:-tracetrail_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tracetrail-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tracetrail_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tracetrail-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - tracetrail-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: deployment/docker/backend.Dockerfile
    container_name: tracetrail-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-tracetrail_user}:${DB_PASSWORD:-password123}@
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - tracetrail-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Web App
  frontend:
    build:
      context: .
      dockerfile: deployment/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    container_name: tracetrail-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - tracetrail-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

  # AI Module
  ai-module:
    build:
      context: .
      dockerfile: deployment/docker/ai-module.Dockerfile
    container_name: tracetrail-ai
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
      MODEL_PATH: /app/models
    ports:
      - "${AI_PORT:-8001}:8001"
    depends_on:
      - backend
      - redis
    volumes:
      - ai_models:/app/models
      - ai_logs:/app/logs
    networks:
      - tracetrail-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: deployment/docker/backend.Dockerfile
    container_name: tracetrail-celery-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://${DB_USER:-tracetrail_user}:${DB_PASSWORD:-password123}@
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - postgres
      - redis
    volumes:
      - backend_logs:/app/logs
    networks:
      - tracetrail-network

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: .
      dockerfile: deployment/docker/backend.Dockerfile
    container_name: tracetrail-celery-beat
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://${DB_USER:-tracetrail_user}:${DB_PASSWORD:-password123}@
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - tracetrail-network

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: tracetrail-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - tracetrail-network

networks:
  tracetrail-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_logs:
  ai_models:
  ai_logs:
  nginx_logs:
