name: TraceTrail Deployment

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/tracetrail

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend env
        run: cp deployment/environments/development.env backend/.env
      - name: Run project test suite
        env:
          DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_db
        run: bash scripts/ci_cd/test.sh

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}-backend:latest
            ${{ env.REGISTRY }}-backend:${{ github.sha }}
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}-frontend:latest
            ${{ env.REGISTRY }}-frontend:${{ github.sha }}
      - name: Build & push AI module
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Docker/Dockerfile.ai
          push: true
          tags: |
            ${{ env.REGISTRY }}-ai:latest
            ${{ env.REGISTRY }}-ai:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Apply shared resources
        run: |
          kubectl apply -f deployment/kubernetes/service.yaml
          kubectl apply -f deployment/kubernetes/postgres-deployment.yaml
      - name: Deploy workloads
        env:
          SHA: ${{ github.sha }}
        run: |
          kubectl set image deployment/backend backend=${{ env.REGISTRY }}-backend:${SHA} -n tracetrail --record || \
            kubectl apply -f deployment/kubernetes/backend-deployment.yaml
          kubectl set image deployment/frontend frontend=${{ env.REGISTRY }}-frontend:${SHA} -n tracetrail --record || \
            kubectl apply -f deployment/kubernetes/frontend-deployment.yaml
          kubectl set image deployment/ai-module ai-module=${{ env.REGISTRY }}-ai:${SHA} -n tracetrail --record || \
            kubectl apply -f deployment/kubernetes/ai-deployment.yaml
          kubectl apply -f deployment/kubernetes/ingress.yaml
