name: Deploy to Production

on:
  release:
    types: [published]

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.release.tag_name }}
        run: |
          docker build -f deployment/docker/backend.Dockerfile -t $ECR_REGISTRY/tracetrail-backend:$IMAGE_TAG .
          docker push $ECR_REGISTRY/tracetrail-backend:$IMAGE_TAG
          docker build -f deployment/docker/frontend.Dockerfile -t $ECR_REGISTRY/tracetrail-frontend:$IMAGE_TAG .
          docker push $ECR_REGISTRY/tracetrail-frontend:$IMAGE_TAG

      - name: Update Kubernetes manifests
        run: |
          sed -i "s|image: tracetrail/backend:latest|image: $ECR_REGISTRY/tracetrail-backend:$IMAGE_TAG|g" deployment/k8s/*.yaml
          sed -i "s|image: tracetrail/frontend:latest|image: $ECR_REGISTRY/tracetrail-frontend:$IMAGE_TAG|g" deployment/k8s/*.yaml

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name tracetrail-production --region us-east-1
          kubectl apply -f deployment/k8s/
          kubectl rollout status deployment/backend -n tracetrail
          kubectl rollout status deployment/frontend -n tracetrail

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,job
          text: 'Deployment to production completed!'
