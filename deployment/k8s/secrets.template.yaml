apiVersion: v1
kind: Secret
metadata:
  name: tracetrail-backend-secrets
  namespace: tracetrail
type: Opaque
stringData:
  DATABASE_URL: ${DATABASE_URL}
  SECRET_KEY: ${SECRET_KEY}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_NAME: ${DB_NAME}
  REDIS_URL: ${REDIS_URL}

# Usage:
#   export DATABASE_URL="postgresql+psycopg://..."
#   export SECRET_KEY="..."
#   ...
#   envsubst < deployment/k8s/secrets.template.yaml | kubectl apply -f -

